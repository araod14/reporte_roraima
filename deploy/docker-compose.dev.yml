# Entorno de desarrollo/prueba local: solo db + api, api expuesta en localhost:8000.
# Uso:  docker compose -f docker-compose.dev.yml up --build
name: roraima-library-dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roraima
      POSTGRES_PASSWORD: roraima
      POSTGRES_DB: roraima
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roraima"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://roraima:roraima@db:5432/roraima
      JWT_SECRET: dev-secret-no-usar-en-produccion
      BASE_URL: http://localhost:8010
      REPORTS_DIR: /var/reports
      SEED_PASSWORD: roraima2026
      LIBRARY_PDF_DIR: /var/tps-pdfs
      LIBRARY_GEMINI_KEY_FILE: /run/library/gemini.key
      LIBRARY_GEMINI_FREE_TIER_CONFIRMED: ${LIBRARY_GEMINI_FREE_TIER_CONFIRMED:-false}
      HF_HOME: /var/library-models
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - reports_dev:/var/reports
      - ../info_tps:/var/tps-pdfs:ro
      - ../library_secrets:/run/library:ro
      - library_models_dev:/var/library-models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 15

  library_worker:
    build:
      context: ../backend
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://roraima:roraima@db:5432/roraima
      LIBRARY_PDF_DIR: /var/tps-pdfs
      HF_HOME: /var/library-models
    volumes:
      - ../info_tps:/var/tps-pdfs:ro
      - library_models_dev:/var/library-models
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do python -m app.scripts.ingest_library; sleep 3600; done"]

volumes:
  pgdata_dev:
  reports_dev:
  library_models_dev:
